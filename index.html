<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
:root { --cake-color: #5d4037; --cream-color: #ffffff; --tramonto-oro: #ffcc33; --tramonto-rosa: #ff6699; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
.hidden { display: none !important; }
#overlay-iniziale { position: fixed; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 200; transition: opacity 1s; }
.barra-caricamento { width: 200px; height: 4px; background: #222; margin: 20px auto; overflow: hidden; }
#progresso { width: 0%; height: 100%; background: linear-gradient(90deg, var(--tramonto-oro), var(--tramonto-rosa)); transition: width 3s; }
#testo-stato { color: var(--tramonto-oro); font-size: 0.9rem; text-align: center; }
#btn-inizia { background: none; border: 2px solid var(--tramonto-rosa); color: var(--tramonto-rosa); padding: 10px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; }
#cake-world { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #4b2670 0%, #110422 100%); z-index: 100; position: relative; transition: opacity 2.5s ease-in-out, transform 2.5s ease-in-out; }
.cake-base { position: relative; display: flex; flex-direction: column; align-items: center; }
@keyframes fall { 0% { transform: translateY(-800px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
.animate-fall { animation: fall 0.6s cubic-bezier(.47,.11,.34,1.06) forwards; }
.layer-group { position: relative; display: flex; flex-direction: column; align-items: center; margin-bottom: -4px; width: 100%; }
.dough { height: 25px; background: var(--cake-color); border-radius: 4px; opacity: 0; }
.cream { height: 12px; background: var(--cream-color); border-radius: 10px 10px 2px 2px; opacity: 0; position: relative; z-index: 2; }
.g1 .dough, .g1 .cream { width: 240px; } .g2 .dough, .g2 .cream { width: 190px; } .g3 .dough, .g3 .cream { width: 140px; }
.drip { position: absolute; top: 6px; width: 10px; height: 0; background: var(--cream-color); border-radius: 0 0 10px 10px; }
@keyframes drip-anim { to { height: 25px; } }
.animate-drip { animation: drip-anim 0.6s ease-out forwards; }
.candle-number { position: relative; cursor: pointer; opacity: 0; z-index: 10; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(255, 64, 129, 0.4)); }
.number-body { font-family: 'Fredoka One', cursive; font-size: 4.5rem; line-height: 1; position: relative; background: linear-gradient(180deg, #ff80ab 0%, #ff4081 50%, #c60055 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.8); }
.candle-texture { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background-image: radial-gradient(#ffd700 15%, transparent 18%); background-size: 8px 8px; -webkit-background-clip: text; background-clip: text; opacity: 0.6; }
.wick { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 5px; height: 14px; background: linear-gradient(#222, #555); border-radius: 2px; }
.flame { width: 20px; height: 35px; position: absolute; top: -45px; left: 50%; transform: translateX(-50%); z-index: 15; transition: 0.4s; }
.flame-inner { width: 100%; height: 100%; border-radius: 50% 50% 20% 20%; background: linear-gradient(to bottom, #fff 0%, #ffeb3b 20%, #ff9800 50%, #f44336 80%); box-shadow: 0 0 20px #ff9800, 0 0 40px #ff5722, 0 -5px 15px #fff; animation: flicker 0.1s infinite alternate, sway 2s infinite ease-in-out; }
@keyframes sway { 0% { transform: rotate(-2deg); } 100% { transform: rotate(2deg); } }
@keyframes flicker { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.1); opacity: 1; } }
.smoke { position: absolute; top: -30px; left: 50%; width: 10px; height: 10px; background: rgba(255,255,255,0.9); border-radius: 50%; opacity: 0; }
.candle-number.off .flame { transform: translateX(-50%) scale(0); opacity: 0; }
.candle-number.off .smoke { animation: smokeRise 2.5s forwards; }
@keyframes smokeRise { 0% { opacity: 0.8; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-150%, -100px) scale(8); filter: blur(10px); } }
.plate { width: 300px; height: 12px; background: #cfd8dc; border-radius: 50%; opacity: 0; margin-top: -2px; }
#transizione-testo { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffffff; font-family: 'Fredoka One'; font-size: 1.6rem; z-index: 150; opacity: 0; transition: opacity 1.5s ease; white-space: nowrap; width: 100%; text-align: center; }
.hidden-scene { opacity: 0; pointer-events: none; transition: opacity 3s ease; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; }
.scena-attiva { opacity: 1 !important; pointer-events: auto !important; }
.scena-fonda { position: relative; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #ffcc33 0%, #ff7e5f 100%); overflow: hidden; }
.cielo-finale { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, #673ab7 0%, #ff0055 70%, #ff66aa 100%); opacity: 0; z-index: 0; }
.sole { position: absolute; left: 50%; width: 80px; height: 80px; background: #fff; border-radius: 50%; transform: translateX(-50%); z-index: 1; top: 15%; }
.nuvola { position: absolute; background: rgba(255, 255, 255, 0.4); filter: blur(15px); border-radius: 50%; z-index: 2; }
.n1 { width: 300px; height: 100px; top: 10%; animation: voga 60s linear infinite; }
.n2 { width: 250px; height: 80px; top: 30%; animation: voga 90s linear infinite reverse; }
.n3 { width: 400px; height: 120px; top: 20%; animation: voga 120s linear infinite; opacity: 0.3; }
@keyframes voga { from { left: -350px; } to { left: 110vw; } }
.orizzonte { position: absolute; bottom: 0; width: 100%; height: 35%; z-index: 10; }
.collina { position: absolute; bottom: 0; width: 120%; }
.collina-dietro { height: 100%; left: -10%; background: #3c1e5a; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
.collina-davanti { height: 70%; right: -10%; background: #1a0a2e; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
#container-messaggi { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 85%; text-align: center; z-index: 100; font-family: 'Segoe UI', sans-serif; color: white; font-size: 1.3rem; }
.messaggio-testo { opacity: 0; transition: opacity 1.2s ease; position: absolute; width: 100%; left: 0; top: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
.messaggio-testo.visibile { opacity: 1; }
@keyframes apparizioneRosa { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes tramontoRosso { 0% { top: 15%; background: #fff; box-shadow: 0 0 50px #fff, 0 0 100px #ffcc33; } 50% { background: #ffcc33; box-shadow: 0 0 60px #ffcc33, 0 0 120px #ff6600; } 100% { top: 85%; background: #ff0000; box-shadow: 0 0 80px #ff0000, 0 0 160px #440000; } }
@keyframes scurisciDietro { 0% { background: #3c1e5a; } 100% { background: #1a0a2e; } }
@keyframes scurisciDavanti { 0% { background: #1a0a2e; } 100% { background: #0c051a; } }
#titolo-auguri { color: white; font-size: 1.6rem; margin-top: 30px; opacity: 0; transition: 1s; font-family: 'Fredoka One'; text-shadow: 0 0 10px var(--tramonto-rosa); }
#btn-messaggio { margin-top: 30px; padding: 12px 40px; border-radius: 40px; border: none; background: linear-gradient(45deg, var(--tramonto-oro), var(--tramonto-rosa)); color: white; font-weight: bold; cursor: pointer; transition: 0.5s; }
.hidden-opacity { opacity: 0; visibility: hidden; }
.show-btn { opacity: 1 !important; visibility: visible !important; }
#hint-click { color: var(--tramonto-oro); font-size: 0.8rem; margin-bottom: 50px; text-transform: uppercase; letter-spacing: 2px; transition: 0.5s; }

/* STILE DEDICA FINALE: NUVOLA NITIDA */
#dedica-finale { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 110; width: 100%; pointer-events: none; }
.scritta-nuvola { 
    font-family: 'Fredoka One', cursive; 
    font-size: 5rem; 
    color: white; 
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5), 0 0 30px rgba(255, 255, 255, 0.3);
    filter: blur(0.8px); 
    animation: soffio 4s ease-out forwards; 
    letter-spacing: 8px; 
}
.sottotitolo-finale { 
    font-family: 'Fredoka One', cursive; 
    font-size: 1.4rem; 
    color: white; 
    margin-top: 65px; 
    opacity: 0; 
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 255, 255, 0.4);
    filter: blur(0.5px); 
    animation: soffio 4s ease-out 2s forwards; 
    text-transform: uppercase; 
    letter-spacing: 4px; 
}
@keyframes soffio { 
    0% { opacity: 0; transform: scale(0.8) translateY(30px); filter: blur(10px); } 
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0.8px); } 
}
@media (max-width: 600px) { .sole { width: 65px; height: 65px; } .orizzonte { height: 30%; } #container-messaggi { font-size: 1.1rem; } .scritta-nuvola { font-size: 3.5rem; } .sottotitolo-finale { font-size: 0.9rem; margin-top: 45px; } }

/* PAGINA PIN */
#overlay-pin { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 300; transition: opacity 1s; }
.intro-container { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 0 20px; text-align: center; }
.intro-riga { color: #fff; font-family: 'Fredoka One', cursive; font-size: 1.4rem; opacity: 0; transition: opacity 1.4s ease; text-shadow: 0 0 10px var(--tramonto-rosa); min-height: 1.6em; }
.intro-riga.visibile { opacity: 1; }
#pin-box { margin-top: 20px; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; text-align: center; }
#pin-box.visibile { opacity: 1; pointer-events: auto; }
#pin-input { width: 160px; background: none; border: none; border-bottom: 2px solid var(--tramonto-rosa); color: var(--tramonto-oro); font-family: 'Fredoka One', cursive; font-size: 2rem; letter-spacing: 14px; text-indent: 14px; text-align: center; outline: none; padding: 4px 0; }
#pin-errore { color: var(--tramonto-rosa); font-size: 0.8rem; margin-top: 12px; opacity: 0; transition: opacity 0.4s; }
#pin-box.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@media (max-width: 600px) { .intro-riga { font-size: 1.15rem; } }

    </style>
</head>
<body>
    <div id="overlay-pin">
        <div class="intro-container">
            <div class="intro-riga">Sei ancora qui? 😄</div>
            <div class="intro-riga">C'è qualcosa di nuovo qui...</div>
            <div class="intro-riga">Questa volta ti servirà un PIN</div>
            <div class="intro-riga">Se sei curiosa... ti darò il PIN</div>
            <div id="pin-box">
                <input id="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN">
                <div id="pin-errore">PIN sbagliato</div>
            </div>
        </div>
    </div>
    <audio id="musica-sottofondo" src="audio.mp3" preload="auto" loop></audio>
    <div id="overlay-iniziale">
        <div class="loader-container">
            <div id="testo-stato">Preparazione in corso...</div>
            <div class="barra-caricamento"><div id="progresso"></div></div>
            <button id="btn-inizia" class="hidden">Inizia</button>
        </div>
    </div>
    <div id="cake-world" class="hidden">
        <div class="cake-base">
            <div id="hint-click" style="opacity: 0;">Spegni la candela</div>
            <div class="candle-number" id="group-candele">
                <div class="number-body">20<div class="candle-texture"></div><div class="wick"></div></div>
                <div class="flame"><div class="flame-inner"></div></div>
                <div class="smoke"></div>
            </div>
            <div class="layer-group g3">
                <div class="cream c3"><div class="drip"></div><div class="drip"></div></div>
                <div class="dough d3"></div>
            </div>
            <div class="layer-group g2">
                <div class="cream c2"><div class="drip"></div><div class="drip"></div></div>
                <div class="dough d2"></div>
            </div>
            <div class="layer-group g1">
                <div class="cream c1"><div class="drip"></div><div class="drip"></div></div>
                <div class="dough d1"></div>
            </div>
            <div class="plate"></div>
            <h1 id="titolo-auguri">Buon compleanno Chiara</h1>
            <button id="btn-messaggio" class="hidden-opacity">Un messaggio per te (alza il volume)</button>
        </div>
    </div>
    <div id="transizione-testo" class="hidden">Goditi il tramonto 😉</div>
    <div id="sunset-scene" class="hidden-scene">
        <div class="scena-fonda">
            <div class="cielo-finale"></div>
            <div class="sole"></div>
            <div class="nuvola n1"></div>
            <div class="nuvola n2"></div>
            <div class="nuvola n3"></div>
            <div class="orizzonte">
                <div class="collina collina-dietro"></div>
                <div class="collina collina-davanti"></div>
            </div>
            <div id="container-messaggi"></div>
            <div id="dedica-finale" class="hidden">
                <div class="scritta-nuvola">Chiara</div>
                <div class="sottotitolo-finale">Buon 20° compleanno</div>
            </div>
        </div>
    </div>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const progresso = document.getElementById("progresso");
    const btnInizia = document.getElementById("btn-inizia");
    const overlayIniziale = document.getElementById("overlay-iniziale");
    const cakeWorld = document.getElementById("cake-world");
    const sunsetScene = document.getElementById("sunset-scene");
    const transText = document.getElementById("transizione-testo");
    const btnMessaggio = document.getElementById("btn-messaggio");
    const hintClick = document.getElementById("hint-click");
    const containerMessaggi = document.getElementById("container-messaggi");
    const musica = document.getElementById("musica-sottofondo");

    const frasi = [
        "Chiara", "quest'oggi", "è un giorno speciale", "e per questo motivo", "colgo l'occasione del tuo compleanno",
        "per dedicarti due parole", "che probabilmente", "non sarei riuscito", "a dirti personalmente.",
        "Ho preparato", "questo piccolo regalo", "che spero apprezzi...", "mettendo cura", "in ogni dettaglio",
        "pregando insistentemente", "e credo", "che tutto questo", "è stato possibile", "solo per merito di Dio.",
        "",
        "Sai cosa significa il tuo nome?", "Significa...", "luminosa, o... splendente", "perciò", "lascia che questa giornata",
        "splenda come splendi tu.", "Ti auguro il meglio", "che la tua vita sia serena", "e splendente 😁",
        "e che Dio ti doni", "un anno felice.", "Ti auguro", "di non perdere il modo", "in cui guardi il mondo", "di continuare",
        "a trovare il bello", "nelle piccole cose", "di avere gli occhi", "capaci di emozionarsi", "davanti a un cielo colorato",
        "come questo 😉", "e ti auguro", "ogni giorno", "di trovare un tramonto", "che ti porti un sorriso", "anche il giorno dopo.",
        " ", "Sai...",
        "in queste ultime settimane", "ti ho considerata", "in una maniera diversa", "e anche se", "molto spesso", "mi limito a un...",
        "\"ciao\" o un... \"come va?\" 😐", "ho sempre voluto andare oltre", "ma non sempre ci riesco", "è come se", "avessi dimenticato come si fa",
        "a volte", "faccio passi troppo lunghi", "e questo mi fa capire", "quanto sono umano", "in tutti i miei errori", "nonostante la mia inesperienza",
        "",
        "Per finire", "ho pensato parecchio", "a questo messaggio", "poiché a voce...", "non mi viene mai", "in modo naturale",
        "o spontaneo, si potrebbe dire.", "Mi piacerebbe avere una conversazione", "e conoscerti meglio...", "nonostante le mie difficoltà", "perciò",
        "spero che questo messaggio", "sia solo l'inizio",
        "di una lunga conversazione <img src=\"happy.png\" alt=\"happy\" style=\"display: inline-block; height: 1.5em; width: auto; margin-top: 8px;\">",
        "<i>„Il Signore faccia risplendere</i>", "<i>il suo volto su di te</i>", "<i>e ti sia propizio“</i>", "<i>Numeri 6:25</i>"
    ];

    function avviaCaricamento() {
        setTimeout(() => { progresso.style.width = "100%"; }, 500);
        setTimeout(() => {
            document.querySelector(".barra-caricamento").style.display = "none";
            document.getElementById("testo-stato").style.display = "none";
            btnInizia.classList.remove("hidden");
        }, 3500);
    }

    /* ---------- PAGINA PIN ---------- */
    const PIN_CORRETTO = "0904";
    const overlayPin = document.getElementById("overlay-pin");
    const righeIntro = Array.from(document.querySelectorAll(".intro-riga"));
    const pinBox = document.getElementById("pin-box");
    const pinInput = document.getElementById("pin-input");
    const pinErrore = document.getElementById("pin-errore");
    const attesa = ms => new Promise(r => setTimeout(r, ms));

    async function sequenzaIntro() {
        await attesa(800);
        righeIntro[0].classList.add("visibile");
        await attesa(2800);
        righeIntro[0].classList.remove("visibile");
        await attesa(1400);
        righeIntro[0].textContent = "Sono felice che sei ancora qui";
        righeIntro[0].classList.add("visibile");
        await attesa(2600);
        for (let i = 1; i < righeIntro.length; i++) {
            righeIntro[i].classList.add("visibile");
            await attesa(2200);
        }
        pinBox.classList.add("visibile");
        pinInput.focus();
    }

    pinInput.addEventListener("input", () => {
        pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 4);
        pinErrore.style.opacity = "0";
        if (pinInput.value.length < 4) return;
        if (pinInput.value === PIN_CORRETTO) {
            pinInput.disabled = true;
            overlayPin.style.opacity = "0";
            setTimeout(() => {
                overlayPin.classList.add("hidden");
                avviaCaricamento();
            }, 1000);
        } else {
            pinBox.classList.remove("shake");
            void pinBox.offsetWidth;
            pinBox.classList.add("shake");
            pinErrore.style.opacity = "1";
            pinInput.value = "";
        }
    });

    overlayPin.addEventListener("click", () => { if (!pinInput.disabled) pinInput.focus(); });
    sequenzaIntro();

    btnInizia.addEventListener("click", () => {
        overlayIniziale.style.opacity = "0";
        setTimeout(() => {
            overlayIniziale.classList.add("hidden");
            cakeWorld.classList.remove("hidden");
            avviaTorta();
        }, 1000);
    });

    function avviaTorta() {
        const plate = document.querySelector(".plate");
        const candle = document.querySelector(".candle-number");
        plate.classList.add("animate-fall");
        setTimeout(() => document.querySelector(".d1").classList.add("animate-fall"), 600);
        setTimeout(() => {
            const c1 = document.querySelector(".c1");
            c1.classList.add("animate-fall");
            c1.querySelectorAll(".drip").forEach(d => d.classList.add("animate-drip"));
        }, 1000);
        setTimeout(() => document.querySelector(".d2").classList.add("animate-fall"), 1600);
        setTimeout(() => {
            const c2 = document.querySelector(".c2");
            c2.classList.add("animate-fall");
            c2.querySelectorAll(".drip").forEach(d => d.classList.add("animate-drip"));
        }, 2000);
        setTimeout(() => document.querySelector(".d3").classList.add("animate-fall"), 2600);
        setTimeout(() => {
            const c3 = document.querySelector(".c3");
            c3.classList.add("animate-fall");
            c3.querySelectorAll(".drip").forEach(d => d.classList.add("animate-drip"));
        }, 3000);
        setTimeout(() => { 
            candle.classList.add("animate-fall");
            setTimeout(() => {
                document.getElementById("titolo-auguri").style.opacity = "1";
                hintClick.style.opacity = "1";
            }, 700);
        }, 3800);
    }

    document.getElementById("group-candele").addEventListener("click", function() {
        if (!this.classList.contains("off")) {
            this.classList.add("off");
            hintClick.style.opacity = "0";
            setTimeout(() => btnMessaggio.classList.add("show-btn"), 2500);
        }
    });

    btnMessaggio.addEventListener("click", () => {
        cakeWorld.style.opacity = "0";
        cakeWorld.style.transform = "scale(0.7)";
        setTimeout(() => { musica.play().catch(e => console.log("Audio bloccato:", e)); }, 3000);
        setTimeout(() => {
            transText.classList.remove("hidden");
            transText.style.opacity = "1";
            setTimeout(() => {
                transText.style.opacity = "0";
                setTimeout(() => {
                    transText.classList.add("hidden");
                    cakeWorld.classList.add("hidden");
                    sunsetScene.classList.add("scena-attiva");
                    document.querySelector(".cielo-finale").style.animation = "apparizioneRosa 120s linear forwards";
                    document.querySelector(".sole").style.animation = "tramontoRosso 120s linear forwards";
                    document.querySelector(".collina-dietro").style.animation = "scurisciDietro 120s linear forwards";
                    document.querySelector(".collina-davanti").style.animation = "scurisciDavanti 120s linear forwards";
                    avviaSequenzaMessaggi();
                }, 1000);
            }, 3000);
        }, 1000);
    });

    async function avviaSequenzaMessaggi() {
        for (let i = 0; i < frasi.length; i++) {
            const p = document.createElement("p");
            p.className = "messaggio-testo";
            p.innerHTML = frasi[i];
            containerMessaggi.appendChild(p);
            await new Promise(r => setTimeout(r, 100));
            p.classList.add("visibile");
            await new Promise(r => setTimeout(r, 2200)); 
            p.classList.remove("visibile");
            await new Promise(r => setTimeout(r, 1200)); 
            p.remove();
        }

        setTimeout(() => {
            document.getElementById("dedica-finale").classList.remove("hidden");
        }, 1000);
    }
});
</script>
</body>
</html>
